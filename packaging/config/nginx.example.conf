# Include inside an existing TLS-enabled server block. Certificates are managed
# by the owner's reverse proxy; neither infra-server nor infra-ui handles TLS.
client_max_body_size 16m;
location /api/v1/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_read_timeout 40s;
    proxy_set_header Host $host;
}
location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_read_timeout 40s;
    proxy_set_header Host $host;
}
